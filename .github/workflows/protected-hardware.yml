# Phase 18 protected hardware jobs (Levels 2-4, CUDA, TPU).
#
# These jobs require self-hosted labeled runners and are NOT part of the
# Level-1 PR gate. They run on workflow_dispatch or the nightly schedule.
#
# Modeling policy (implementation_plan/phase_18):
#   - Level 2 (synthetic GPU) and Level 4 (golden) use tiny/local models only.
#   - Level 3 (real-checkpoint smoke) is gated separately and downloads real
#     MedSigLIP / 3D-CT / MRI-task / pathology / MedGemma checkpoints.
#   - Distributed jobs only run on labeled multi-device runners, and their
#     environments set MEDFM_RUN_DISTRIBUTED_TESTS=1 so parity/checkpoint
#     evidence is recorded (never silently skipped).
#
# Every job fails if the hardware is absent; guards require the env var, so an
# accidental run on the wrong runner is a failure, not a silent skip.

name: protected-hardware

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *" # nightly protected regression

concurrency:
  group: protected-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  level2-gpu:
    name: "L2 synthetic GPU (tiny models)"
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra medical --extra hf --extra cuda --all-groups
      - run: make test-level2

  level3-real-checkpoints:
    name: "L3 protected real-checkpoint smoke"
    runs-on: [self-hosted, gpu, big]
    env:
      MEDFM_RUN_REAL_CHECKPOINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra medical --extra hf --extra pathology --extra cuda --all-groups
      - run: make test-protected

  level4-golden-gpu:
    name: "L4 golden regression (GPU tolerances)"
    runs-on: [self-hosted, gpu]
    env:
      MEDFM_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra medical --extra hf --extra cuda --all-groups
      - run: make test-golden

  cuda-single:
    name: "CUDA single-device"
    runs-on: [self-hosted, gpu]
    env:
      MEDFM_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra medical --extra hf --extra cuda --all-groups
      - run: make test-gpu

  cuda-distributed:
    name: "CUDA distributed (checkpoint/resume + valid-count evidence)"
    runs-on: [self-hosted, gpu, distributed]
    env:
      MEDFM_RUN_DISTRIBUTED_TESTS: "1"
      MEDFM_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra medical --extra hf --extra cuda --all-groups
      - run: make test-distributed-gpu

  tpu-replicated:
    name: "TPU replicated"
    runs-on: [self-hosted, tpu]
    env:
      MEDFM_RUN_TPU_TESTS: "1"
      PJRT_DEVICE: "TPU"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev --extra medical --extra hf --extra tpu
      - run: make test-tpu

  tpu-distributed:
    name: "TPU SPMD / FSDP (compile counts + static buckets)"
    runs-on: [self-hosted, tpu, distributed]
    env:
      MEDFM_RUN_DISTRIBUTED_TESTS: "1"
      MEDFM_RUN_TPU_TESTS: "1"
      PJRT_DEVICE: "TPU"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev --extra medical --extra hf --extra tpu
      - run: make test-distributed-tpu
      - name: Static TPU bucket + compile-count report
        run: uv run --frozen python -m medfm.cli.release matrix
