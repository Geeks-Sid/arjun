schema_version: 1
model_id: local
model:
  id: local
  family: phase15_pathology_tile
  checkpoint_source: offline_random_contract
  revision: phase15-1
dataset:
  id: phase15-synthetic-tile-classification-v1
  revision: synthetic-v1
  split_policy: patient_disjoint
task:
  type: BINARY_CLASSIFICATION
recipe:
  phase: 15
  id: tile-classification-hoptimus-linear
  family: tile_classification
  backbone: h-optimus-0
  modality: PATHOLOGY_TILE
  mode: offline_tiny
  offline_tiny: true
  stage: 1
  head: linear
  tile_shape: [16, 16]
  tile_shape_buckets: [[16, 16]]
  tile_mpp: 0.5
  magnification: 20x
  cache_embeddings: true
  baseline: hoptimus_frozen_linear
  metrics: [tile_auroc, tile_auprc, patient_clustered, slide_clustered, subgroup]
accelerator:
  backend: cuda
  precision: bf16
  distribution: single
  static_shapes: true
batch:
  microbatch_per_device: 2
  gradient_accumulation_steps: 1
  global_batch_size: 2
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
freeze_schedule:
  - until_step: 1000
    train: [task_head]
  - train: [task_head]
peft:
  enabled: false
memory:
  use_cache_during_training: false
tracking:
  kind: local_json
checkpoint:
  format: safetensors
seed: 1510
max_steps: 1000
epochs: 1
save_every_steps: 100
output_dir: artifacts/runs/phase15/tile_classification_hoptimus_linear
base_model_revision: h-optimus-0-offline-random-contract
preprocessing_hash: phase15-tile-rgb-16-v1
