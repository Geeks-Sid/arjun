schema_version: 1
model_id: local
model:
  id: local
  family: external-vlm
  revision: production-checkpoint-required
  checkpoint_source: phase05_local_checkpoint
dataset:
  id: approved-vqa-structured-findings
  revision: manifest-revision-required
  split_policy: patient_first_site_then_time
task:
  type: VISUAL_QUESTION_ANSWERING
recipe:
  id: external-vlm-tpu-cached
  family: external_vlm
  backbone: rad-dino
  modality: XRAY_2D
  mode: production
  offline_tiny: false
  stage: 1
  use_lora: false
  image_size: 518
  channels: 3
  patch_size: 14
  visual_tokens: 64
  text_tokens: 512
  bridge: perceiver
  prompt_revision: phase13-vqa-prompt-v1
  cached_visual_tokens: true
  static_bucket: {visual_tokens: 64, text_tokens: 512}
  no_recompile_gate: required
  portable_export_gate: required
accelerator:
  backend: xla_tpu
  precision: bf16
  distribution: replicated
  attention: sdpa
  static_shapes: true
  fail_on_recompilation_after_warmup: true
  max_steady_state_compilations: 1
  warmup_steps: 3
batch:
  microbatch_per_device: 1
  gradient_accumulation_steps: 16
  global_batch_size: 16
optimizer: {name: adamw, lr: 0.00002, weight_decay: 0.0}
freeze_schedule: [{train: [bridge]}]
peft: {enabled: false}
quantization: {enabled: false}
memory:
  gradient_checkpointing: {language: true}
  use_cache_during_training: false
tracking: {kind: local_json}
checkpoint: {format: torch, save_optimizer: true}
seed: 13
max_steps: 1000
epochs: 3
save_every_steps: 100
output_dir: artifacts/runs/phase13/external_vlm_tpu_cached
dataset_hash: approved-manifest-sha256-required
preprocessing_hash: rad-dino-518-preprocess-v1
base_model_revision: production-checkpoint-required
