schema_version: 1
model_id: local
model:
  id: local
  family: medgemma-native
  revision: offline-random-contract
  checkpoint_source: offline_random_contract
dataset:
  id: phase13-synthetic-vqa-v1
  revision: synthetic-v1
  split_policy: patient_first_site_then_time
task:
  type: VISUAL_QUESTION_ANSWERING
recipe:
  id: native-vlm-smoke
  family: native_vlm
