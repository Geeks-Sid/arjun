  enabled: false
memory:
  gradient_checkpointing:
    language: true
  use_cache_during_training: false
tracking:
  kind: local_json
checkpoint:
  format: torch
  save_optimizer: true
seed: 13
max_steps: 1
epochs: 1
save_every_steps: 1
output_dir: artifacts/runs/phase13/native_vlm_smoke
