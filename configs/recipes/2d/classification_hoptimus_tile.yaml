schema_version: 1
model_id: local
model:
  id: local
  family: h-optimus-0
  repository: https://huggingface.co/bioptimus/H-Optimus-0
  revision: pinned-phase05-revision
  checkpoint_source: phase05_local_checkpoint
dataset:
  id: approved-pathology-tile-classification
  revision: manifest-revision-required
  split_policy: patient_first_site_then_time
task:
  type: MULTICLASS_CLASSIFICATION
recipe:
  id: classification-hoptimus-tile
  family: classification
  backbone: h-optimus-0
  modality: PATHOLOGY_TILE
  mode: production
  offline_tiny: false
  stage: A
  use_lora: false
  image_size: 224
  channels: 3
  patch_size: 14
  head: linear
  metrics: [auroc, auprc, brier, ece, operating_points, subgroups]
accelerator:
  backend: cuda
  precision: bf16
  distribution: single
batch:
  microbatch_per_device: 16
  gradient_accumulation_steps: 1
  global_batch_size: 16
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
freeze_schedule:
  - until_step: 1000
    train: [task_head]
  - train: [task_head, vision_lora]
peft:
  enabled: false
memory:
  use_cache_during_training: false
tracking:
  kind: local_json
checkpoint:
  format: safetensors
seed: 13
max_steps: 1000
epochs: 10
save_every_steps: 100
output_dir: artifacts/runs/phase13/classification_hoptimus_tile
dataset_hash: approved-manifest-sha256-required
preprocessing_hash: h-optimus-224-preprocess-v1
base_model_revision: pinned-phase05-revision
