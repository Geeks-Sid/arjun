    vision: false
  use_cache_during_training: false
tracking:
  kind: local_json
checkpoint:
  format: safetensors
  save_optimizer: true
seed: 13
max_steps: 1000
epochs: 10
save_every_steps: 100
output_dir: artifacts/runs/phase13/classification_medsiglip
