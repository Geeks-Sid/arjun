vertical_slices:
  - id: VS-2D
    modality: XRAY_2D
    task: MULTILABEL_CLASSIFICATION
    models: [rad-dino, medsiglip]
    description: "Frozen 2D encoder + trained multilabel head"
  - id: VS-3D
    modality: CT_3D
    task: MULTICLASS_CLASSIFICATION
    models: [ct-fm, flexict-3d]
    description: "Frozen 3D CT encoder + trained head"
  - id: VS-WSI
    modality: PATHOLOGY_WSI
    task: BINARY_CLASSIFICATION
    models: [h-optimus-0, gigapath-flash]
    description: "Tile embeddings + slide aggregator (MIL)"
  - id: VS-SEG
    modality: CT_3D
    task: SEMANTIC_SEGMENTATION
    models: [nv-segment-ctmr, triad, ct-fm]
    description: "Encoder feature maps + segmentation decoder"
  - id: VS-RETRIEVAL
    modality: XRAY_2D
    task: IMAGE_TEXT_RETRIEVAL
    models: [medsiglip]
    description: "Dual-tower contrastive retrieval"
  - id: VS-VLM
    modality: MULTI_IMAGE_2D
    task: REPORT_GENERATION
    models: [medgemma-1.5-4b]
    description: "External encoder + bridge + MedGemma 1.5 4B (QLoRA on CUDA, BF16 LoRA on TPU)"

accelerator_tiers:
  - id: T0
    name: cpu_contract
    description: "CPU contract tests, tiny local models, synthetic data"
    v1_status: required
  - id: T1
    name: cuda_single
    description: "One CUDA GPU, 48 GB VRAM (v1 reference device; local dev shell may be smaller)"
    v1_status: required
  - id: T2
    name: cuda_ddp
    description: "Multi-GPU DDP (replicated)"
    v1_status: required_where_hardware_available
  - id: T3
    name: cuda_fsdp
    description: "Multi-GPU FSDP (sharded)"
    v1_status: required_where_hardware_available
  - id: T4
    name: tpu_single_host
    description: "Single-host TPU via PyTorch/XLA PJRT. Minimum v1 target: tiny-model coverage of all task families plus at least one accepted real HF vision or language backbone."
    v1_status: required
  - id: T5
    name: tpu_multi_host
    description: "Multi-host TPU SPMD/FSDP"
    v1_status: deferred_until_t4_accepted

# Capability statuses per implementation_plan/accelerator_training_strategy.md.
backend_status_enum:
  - UNTESTED
  - CPU_CONTRACT_ONLY
  - SUPPORTED_SINGLE_DEVICE
  - SUPPORTED_REPLICATED
  - SUPPORTED_SHARDED
  - BLOCKED_CUSTOM_OP
  - BLOCKED_MEMORY
  - BLOCKED_UPSTREAM
  - NOT_APPLICABLE

# Per-backend keys are mandatory for every model. No blanket cross-backend key
# is allowed; any SUPPORTED_* status requires evidence (smoke_config + date).
backend_keys: [cpu, cuda_single, cuda_distributed, tpu_single_host, tpu_multi_host]

