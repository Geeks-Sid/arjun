# Preliminary license records for the v1 model roster.
# Schema: model_registry/license_schema.json (structure from idea.md).
# Policy: docs/licensing_policy.md — unresolved terms are BLOCKING, never guessed.
# Cross-field rules enforced by medfm/tools/governance.py:
#   * any use field == "unresolved"  => status must be blocked_unresolved
#   * repository/weights_uri == "unresolved" => status must be blocked_unresolved
#   * approved_* requires accepted terms for gated repos
#   * approved_commercial requires commercial_use == "permitted"

